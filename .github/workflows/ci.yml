# ============================================================
# Integración continua
#
#  build: compila el proyecto y ejecuta todas las pruebas unitarias
#         con Maven sobre JDK 17 (la versión que usa el proyecto).
# ============================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publicar reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
